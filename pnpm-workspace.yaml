overrides:
  '@solidjs/start@2.0.0-alpha.3>esbuild': 0.28.1
  '@solidjs/start@2.0.0-alpha.3>h3': 2.0.1-rc.22
  '@solidjs/start@2.0.0-alpha.3>vite': ^8.0.16
  '@solidjs/vite-plugin-nitro-2@0.1.0>vite': ^8.0.16
allowBuilds:
  '@parcel/watcher': false
  esbuild: false

peerDependencyRules:
  allowedVersions:
    # Rolldown's optional WASI binding pins @emnapi 1.11.1, while
    # @napi-rs/wasm-runtime declares @emnapi 2.0 alpha peers.
    "@napi-rs/wasm-runtime>@emnapi/core": "1.11.1"
    "@napi-rs/wasm-runtime>@emnapi/runtime": "1.11.1"

    # Oxlint loads eslint-plugin-solid for rule definitions only; this project
    # does not use the transitive @typescript-eslint parser or TypeScript API.
    "@typescript-eslint/project-service>typescript": "7"
    "@typescript-eslint/tsconfig-utils>typescript": "7"
    "@typescript-eslint/typescript-estree>typescript": "7"
    "@typescript-eslint/utils>typescript": "7"
